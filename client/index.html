<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9F8F4" />
    <meta
      name="description"
      content="NIVO — هدوم تفضل هادية. قطع مصنوعة في البرتغال وإيطاليا، مصممة في كوبنهاجن."
    />
    <title>NIVO — هدوم تفضل هادية.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

  <body>
    <!-- Marks that JS is running, so the scroll-reveal's hidden state only ever
         applies when something can actually un-hide it. Without this class the
         content renders visible (no-JS, print, a failed bundle). -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
